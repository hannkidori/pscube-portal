        function sortTable(key) {
            if (!key) return;
            if (currentSortColumn === key) {
                sortAsc = !sortAsc;
            } else {

                sortAsc = (key === '台番') ? true : false;

                let valA = a[key];

                if (valA < valB) return sortAsc ? -1 : 1;

            });
